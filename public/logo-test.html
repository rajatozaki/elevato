<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #F9F9F7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; font-family: system-ui, sans-serif; }
  .dark-bg { background: #121212; padding: 30px; border-radius: 16px; display: flex; gap: 30px; align-items: center; }
  .light-bg { background: #FFFFFF; padding: 30px; border-radius: 16px; display: flex; gap: 30px; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  .logo-row { display: flex; align-items: center; }
</style>
</head>
<body>

<div class="light-bg">
  <!-- Variation 1 -->
  <div class="logo-row">
    <svg viewBox="0 0 420 90" width="320" height="70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Letter A -->
      <g fill="#111111">
        <!-- Left Leg Bottom Chunk -->
        <polygon points="6,80 23,80 23,66 12,66" />
        <!-- Left Leg Top Chunk / Apex -->
        <polygon points="36,12 47,12 47,46 36,46" />
        <!-- Right Leg -->
        <polygon points="47,12 59,12 90,80 73,80 47,28" />
      </g>
      <!-- 3 Green Steps -->
      <g fill="#1DB954">
        <rect x="23" y="66" width="10" height="10" />
        <rect x="31" y="56" width="10" height="10" />
        <rect x="39" y="46" width="10" height="10" />
      </g>
      <!-- Text levate -->
      <text x="96" y="80" font-family="'Geist', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="82" font-weight="700" letter-spacing="-0.03em" fill="#111111">levate</text>
    </svg>
  </div>
</div>

</body>
</html>
